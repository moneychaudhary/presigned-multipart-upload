name: Release

# Publish from a version tag, never from a laptop: the tarball is built from the
# tagged commit, after the same checks CI runs, and carries npm provenance — a
# signed link from the published package back to this workflow run.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run lint

      - name: Tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run test:docs
      - run: npm run test:package

      # Pre-releases (1.2.0-beta.1) go out under "next"; everything else is
      # what a plain `npm install` gets.
      - name: Publish
        run: |
          version="$(node -p 'require("./package.json").version')"
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          npm publish --provenance --access public --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
